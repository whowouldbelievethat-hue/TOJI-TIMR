<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toji Studying</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Reem+Kufi:wght@600;700&family=Cairo:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8dccf;--paper:#f5ede4;--ink:#140607;--ac:#b3121b;--ac2:#e8b4a0;--tone:#c9b6a6;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0709;--paper:#26100f;--ink:#f3e9df;--ac:#e0212c;--ac2:#7a2a24;--tone:#3a1614}}
:root[data-theme="dark"]{--bg:#1a0709;--paper:#26100f;--ink:#f3e9df;--ac:#e0212c;--ac2:#7a2a24;--tone:#3a1614}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;font-weight:500;color:var(--ink);background:var(--bg) radial-gradient(var(--tone) 1.3px,transparent 1.5px) 0 0/9px 9px fixed;min-height:100%}
h1,h2,.sfx{font-family:'Reem Kufi','Bangers',sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:4px solid var(--ink);background:var(--ac);color:#fff}
h1{margin:0;font-size:26px;letter-spacing:1px;font-family:'Bangers','Reem Kufi',sans-serif;direction:ltr}h2{margin:0 0 8px;font-size:20px}
#pg{max-width:760px;margin:0 auto;padding:6px 12px 110px}
.pn{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:14px;margin:16px 0;position:relative}
.hero{padding:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr)}
.hero img{width:100%;max-height:340px;object-fit:cover;object-position:50% 25%;display:block;border-bottom:4px solid var(--ink);filter:contrast(1.05)}
.hero.on img{animation:shk .35s infinite}
@keyframes shk{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
.cap{position:absolute;inset-inline:0;top:0;padding:8px 12px;display:flex;justify-content:space-between;pointer-events:none}
.sfx{display:inline-block;font-size:30px;color:var(--ac);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;transform:rotate(-4deg);letter-spacing:1px;direction:ltr}
.hb{padding:12px}
.bt{border-radius:14px;font:inherit;font-weight:800;background:var(--ac);color:#fff;border:3px solid var(--ink);padding:6px 16px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;min-height:44px}
.bt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.bt.g{background:var(--paper);color:var(--ink)}.bt.sm{min-height:36px;padding:2px 10px}.bt.big{font-size:20px;padding:6px 30px}
:focus-visible{outline:4px solid #f5a000;outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:3px solid var(--ink);padding:6px 8px;min-width:0;max-width:100%}
input[type=number]{width:70px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row.c{justify-content:center}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.tabs button{font:inherit;font-weight:800;color:var(--ink);background:none;border:3px solid var(--ink);padding:4px 12px;cursor:pointer}.tabs [aria-selected=true]{background:var(--ac);color:#fff}
.ringw{position:relative;width:min(270px,74vw);margin:4px auto}.ringw svg{width:100%;display:block}
.o{fill:none;stroke:var(--ink);stroke-width:28}.tr{fill:none;stroke:var(--paper);stroke-width:18}.p{fill:none;stroke:var(--ac);stroke-width:18;transform:rotate(-90deg);transform-origin:100px 100px;stroke-dasharray:553;transition:stroke-dashoffset .3s}
.tx{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bangers',sans-serif;font-size:clamp(42px,14vw,64px);direction:ltr;letter-spacing:2px}
.bar{height:20px;border:3px solid var(--ink);background:var(--paper)}.bar i{display:block;height:100%;background:var(--ac)}
.it{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:3px dashed var(--ink);padding:8px 0}.it:last-child{border:0}.it>b{flex:1;min-width:120px}.dn{text-decoration:line-through;opacity:.55}
.chip{border:3px solid var(--ink);padding:0 8px;font-size:13px;background:var(--ac2);color:var(--ink)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g3 .pn{text-align:center;margin:10px 0;padding:8px}.g3 b{display:block;font-size:28px;font-family:'Bangers',sans-serif}
#nv{position:fixed;inset:auto 0 0 0;display:flex;background:var(--paper);border-top:4px solid var(--ink);padding:0 2px calc(2px + env(safe-area-inset-bottom,0px));z-index:5}
#nv button{flex:1;font:inherit;font-size:12px;font-weight:800;background:none;border:0;color:var(--ink);padding:4px 0;cursor:pointer;min-height:52px}#nv button span{display:block;font-size:20px}
#nv [aria-current=true]{background:var(--ac);color:#fff}
#ts{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:12;background:var(--ac);color:#fff;border:3px solid var(--ink);padding:8px 16px;box-shadow:4px 4px 0 var(--ink);font-weight:800;opacity:0;pointer-events:none;transition:opacity .3s}#ts.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pic{position:relative;border-bottom:4px solid var(--ink)}.pic img{border:0!important;max-height:300px!important;filter:saturate(.85) brightness(1.08) contrast(.95)!important}
.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffb3c166,#a8d8ff44);mix-blend-mode:screen;pointer-events:none}
.pic i{position:absolute;z-index:2;font-style:normal;font-size:22px;animation:fl 3s ease-in-out infinite}.pic i:nth-of-type(1){top:10px;inset-inline-end:14px}.pic i:nth-of-type(2){top:46%;inset-inline-start:10px;animation-delay:.8s}.pic i:nth-of-type(3){bottom:46px;inset-inline-end:22px;animation-delay:1.6s}
@keyframes fl{50%{transform:translateY(-8px) rotate(10deg)}}
.bub{position:absolute;z-index:2;inset-inline-start:10px;bottom:10px;max-width:78%;background:#fff;color:#140607;border:3px solid #140607;border-radius:16px 16px 16px 4px;padding:4px 12px;font-weight:800;font-size:14px}
.fm header,.fm #nv,.fm .nf,.fm footer{display:none!important}#fx{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-start:10px;z-index:9}.fm #fx{display:block}
.fm #pg{padding-top:30px}.chat{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px}.chat div{padding:6px 10px;border:3px solid var(--ink);border-radius:14px;white-space:pre-wrap}.chat .u{background:var(--ac2);align-self:flex-start}.chat .a{background:var(--paper);align-self:flex-end}
footer{text-align:center;padding:4px 0 90px;font-family:'Bangers',sans-serif;font-size:18px;letter-spacing:1px;direction:ltr}
:root[data-rm] *,:root[data-rm] *::before,:root[data-rm] *::after{animation:none!important;transition:none!important}
.sub{padding-inline-start:24px;width:100%}.sub label{display:block}.drag{cursor:grab}
#nv button{font-size:10.5px}.day{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:3px dashed var(--ink);padding:6px 0}.day>b{width:64px}
</style></head><body>
